name: Test build (all platforms)

# On-demand build of all three platforms for handing a binary to a tester,
# WITHOUT cutting a release: artifacts only — no git tag, no GitHub Release, no
# auto-update feed, nothing published. Every binary is UNSIGNED:
#   • Windows → SmartScreen warns ("More info" → "Run anyway")
#   • macOS   → ad-hoc signed, NOT notarized: Gatekeeper asks once (README
#               "Opening the app on macOS")
#   • Linux   → AppImage, chmod +x and run
#
# Two ways to run it:
#   • push any branch named  test/**  (this file must be on that branch)
#   • Actions tab → "Test build (all platforms)" → Run workflow
#
# Native module note: nfc-pcsc is a C++ addon, so each platform MUST build on
# its own runner — none of this can be cross-compiled.
#
# Artifacts are throwaway: 7-day retention, and delete them by hand once the
# test is done rather than leaving installers lying around.

on:
  push:
    branches:
      - 'test/**'
  workflow_dispatch:
    inputs:
      mac_prerelease:
        description: 'Also publish the macOS build as a GitHub pre-release for testers (mac-test-N)'
        type: boolean
        default: false

permissions:
  contents: read

# A second push to the same test branch supersedes the first — three full
# Electron builds is not something to queue up twice by accident.
concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # One platform failing must not cancel the other two — the whole point is
      # to see which ones break.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: TigerStudio-Windows-test
            path: dist/*.exe
          - os: macos-latest
            platform: mac
            artifact: TigerStudio-macOS-test
            path: dist/*.dmg
          - os: ubuntu-latest
            platform: linux
            artifact: TigerStudio-Linux-test
            path: dist/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Same list as the release workflow — nfc-pcsc needs the PC/SC headers,
      # and electron-builder needs the packaging tools.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libpcsclite-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            build-essential \
            python3 \
            rpm \
            fakeroot

      - run: npm ci

      # macOS uses the release's own ad-hoc build (build:mac:fork): a build with
      # no signature at all does not start on Apple Silicon.
      - name: Build ${{ matrix.platform }} (unsigned, no publish)
        run: npm run build:${{ matrix.platform }}:${{ matrix.platform == 'mac' && 'fork' || 'nopublish' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked in so Google sign-in works in the test build.
          TIGERTAG_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.TIGERTAG_GOOGLE_DESKTOP_CLIENT_ID }}
          TIGERTAG_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.TIGERTAG_GOOGLE_DESKTOP_CLIENT_SECRET }}
          # Belt and braces on macOS: without this electron-builder still hunts
          # the keychain for an identity and can fail the build on a runner that
          # has none, even with identity=null in the script.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Optional: hand the macOS build to testers who have no GitHub account.
  # Artifacts need a signed-in account and expire after 7 days, so this
  # publishes the two .dmg as a PRE-release instead.
  #
  # Why it cannot reach anyone's auto-updater:
  #   • the tag is `mac-test-<run>`, not semver — electron-updater skips any
  #     release whose tag is not a valid version (GitHubProvider), and the
  #     stable path reads /releases/latest, which never returns a pre-release;
  #   • it is not marked latest and carries no latest*.yml;
  #   • a `mac-test-*` tag does not match build.yml's `v*` trigger.
  #
  # The app is renamed "Tiger Studio Fork" (own bundle id) so that dragging
  # it into Applications does not replace an official Tiger Studio Manager.
  # Delete the pre-release and its tag once the test is over.
  # ─────────────────────────────────────────────────────────────────
  mac-prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.mac_prerelease
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - name: Build macOS test app (ad-hoc signed, own name)
        run: >-
          node scripts/prepare-ffmpeg.mjs darwin &&
          node scripts/gen-oauth-config.mjs &&
          npx electron-builder --mac --publish never
          -c.productName="Tiger Studio Fork"
          -c.appId=io.tigertag.inventory.forktest
          -c.mac.artifactName='Tiger-Studio-Fork-test-${version}-mac-${arch}.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check the signature
        run: |
          set -euo pipefail
          for app in dist/mac*/*.app; do
            echo "== $app"
            codesign --verify --deep --verbose=2 "$app"
          done

      - name: Publish the pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mac-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: macOS test ${{ github.run_number }} (not a release)
          prerelease: true
          make_latest: false
          body: |
            ⚠️ **macOS test build, not a release.** Unofficial fork, not supported by the TigerTag Project. Windows and Linux users: use the latest release instead.

            - Apple chip (M1, M2, M3, M4…): `Tiger-Studio-Fork-test-…-mac-arm64.dmg`
            - Intel: `Tiger-Studio-Fork-test-…-mac-x64.dmg`

            The app is called **Tiger Studio Fork** and installs next to an official Tiger Studio Manager without replacing it. It is not signed by Apple: macOS asks once to allow it, see [Opening the app on macOS / Ouvrir l'application sur macOS](https://github.com/juditech3D/TigerTag-Studio-Manager/blob/claude/project-thread-7fv8tn/README.md#opening-the-app-on-macos--ouvrir-lapplication-sur-macos) (the app name there is "Tiger Studio Manager": use "Tiger Studio Fork" instead). Sign in with your e-mail and password; Google sign-in does not work in this build.
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
